name: POJA Ping Test

on:
  push:
    branches:
      - import-2e2f6900-dfed-4d7a-b6d8-6813d6aa3b8b-ping-test

env:
  ORG_ID: 4eee2f38-a3f2-459d-9429-7bd1e3c10c33
  IMPORT_ID: 2e2f6900-dfed-4d7a-b6d8-6813d6aa3b8b

jobs:
  ping-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run ping test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/test-report"
          chmod +x gradlew
          ./gradlew test --tests PingIT -x jacocoTestCoverageVerification 2>&1 | tee "$RUNNER_TEMP/test-report/build-output.log"

      - name: Zip test report
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/reports/tests/test ]; then
            cp -r build/reports/tests/test/. "$RUNNER_TEMP/test-report/"
          fi
          cd "$RUNNER_TEMP/test-report" && zip -r $GITHUB_WORKSPACE/PING_TEST_REPORT.zip .

      - name: Upload test report
        if: always()
        continue-on-error: true
        run: |
          curl --fail -X POST "https://api.prod.poja.io/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/test-reports/PING_TEST_REPORT" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @PING_TEST_REPORT.zip

  update-import-state:
    runs-on: ubuntu-latest
    needs: ping-test
    if: always()

    steps:
      - name: Update import state
        run: |
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")

          if [ "${{ needs.ping-test.result }}" == "success" ]; then
            JOB_STATUS="SUCCESS"
          else
            JOB_STATUS="FAILURE"
          fi

          curl --fail -X POST "https://api.prod.poja.io/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/states" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg job_name "POST_TRANSFORMATION_PING_TEST" \
                  --arg job_status "$JOB_STATUS" \
                  --arg run_id "${{ github.run_id }}" \
                  --arg attempt_nb "${{ github.run_attempt }}" \
                  --arg repo_owner "${{ github.repository_owner }}" \
                  --arg repo_name "$REPO_NAME" \
                  '{ job_name: $job_name, job_status: $job_status, run_id: $run_id, attempt_nb: $attempt_nb, repo_owner: $repo_owner, repo_name: $repo_name }')"